services:
  db:
    image: mysql:8.4
    container_name: agendafacil-db
    environment:
      MYSQL_DATABASE: agendafacil
      MYSQL_USER: agenda
      MYSQL_PASSWORD: agenda123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: